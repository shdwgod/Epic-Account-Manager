name: Build Windows exe

on:
  push:
    branches: [main, rust-webview]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Rename exe
        shell: pwsh
        run: Copy-Item target/release/epic-account-manager.exe "Epic.Account.Manager.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Epic-Account-Manager-exe
          path: Epic.Account.Manager.exe

      # Pushing a tag like v2.0.0 also publishes the exe as a GitHub Release.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Epic.Account.Manager.exe
