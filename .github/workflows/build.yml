name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push cancels the older run of the same branch; tag builds are never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  APP_NAME: Epic Account Manager

jobs:
  # Fast feedback (about a minute): the UI is plain JavaScript, so catch syntax errors early.
  ui:
    name: UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check ui/strings.js
          node --check ui/renderer.js
          node --check ui-dev/mock-api.js
          node --check ui-dev/serve.mjs

  build:
    name: Test and build (Windows)
    needs: ui
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Read version from Cargo.toml
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = $meta.packages[0].version
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version: $version"

      - name: Tag must match the version in Cargo.toml
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne "v$env:VERSION") {
            throw "Tag '$env:GITHUB_REF_NAME' does not match Cargo.toml version '$env:VERSION'. Bump the version or retag."
          }

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $exe = "target/release/epic-account-manager.exe"
          if (-not (Test-Path $exe)) { throw "Build output is missing." }
          $size = (Get-Item $exe).Length
          Write-Host "Built $exe ($size bytes)"
          if ($size -lt 256KB) { throw "Build output is suspiciously small ($size bytes)." }

          New-Item -ItemType Directory -Path dist | Out-Null
          $final = "dist/$env:APP_NAME.exe"
          Copy-Item $exe $final

          # GitHub turns spaces in release asset names into dots, so the release ships a zip
          # with a clean name; the exe inside keeps its proper name.
          $zip = "dist/Epic-Account-Manager-v$env:VERSION-windows.zip"
          Compress-Archive -Path $final -DestinationPath $zip

          $lines = foreach ($f in @($final, $zip)) {
            "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $(Split-Path $f -Leaf)"
          }
          $lines | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      # Downloadable from the run page as "Epic Account Manager.zip" holding "Epic Account Manager.exe".
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}
          path: dist/${{ env.APP_NAME }}.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload release files
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: Epic Account Manager ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
