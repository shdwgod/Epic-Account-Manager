<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Epic Account Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="shell" class="shell">
    <main id="main">
      <div id="viewHome" class="page">
        <header class="page-head">
          <h1 id="pageTitle"></h1>
          <div class="head-actions">
            <button class="btn ghost" id="btnSettings" type="button"></button>
            <button class="btn" id="btnSave" type="button"></button>
          </div>
        </header>

        <section id="session" class="session" aria-live="polite"></section>

        <div id="listHead" class="list-head">
          <h2 id="listTitle"></h2>
          <div id="filters" class="filters">
            <label class="search" id="searchWrap">
              <span id="searchIcon"></span>
              <input id="search" type="search" autocomplete="off" spellcheck="false" />
            </label>
            <label class="select">
              <select id="sort"></select>
              <span id="sortChevron"></span>
            </label>
            <div class="seg-view" role="group">
              <button type="button" id="viewList"></button>
              <button type="button" id="viewGrid"></button>
            </div>
          </div>
        </div>

        <section id="grid" class="accounts" role="list"></section>
        <section id="empty" class="empty" hidden></section>
      </div>

      <div id="viewSettings" class="page" hidden></div>
    </main>
  </div>

  <div id="dialogs"></div>
  <div id="menuRoot"></div>
  <div id="busy" class="busy" hidden><div id="busyArt" class="busy-art"></div><p id="busyText" class="busy-title"></p><p id="busySub" class="busy-sub"></p></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script src="strings.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
